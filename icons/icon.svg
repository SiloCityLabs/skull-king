  <rect x="262" y="332" width="18" height="26" rx="3" fill="#e8dcc8"/>
  <rect x="286" y="332" width="18" height="26" rx="3" fill="#e8dcc8"/>
  <!-- crossbones -->
  <g stroke="#e8dcc8" stroke-width="22" stroke-linecap="round">
    <line x1="96" y1="392" x2="176" y2="448"/>
    <line x1="176" y1="392" x2="96" y2="448"/>
    <line x1="336" y1="392" x2="416" y2="448"/>
    <line x1="416" y1="392" x2="336" y2="448"/>
