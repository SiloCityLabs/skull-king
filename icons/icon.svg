  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="268" r="168" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.35"/>
  <!-- crown -->
  <path fill="url(#gold)" d="M128 168 168 112l88 56 88-56 40 56-24 40H152z"/>
  <circle cx="168" cy="112" r="14" fill="#f8e8b0"/>
  <circle cx="256" cy="96" r="16" fill="#f8e8b0"/>
  <circle cx="344" cy="112" r="14" fill="#f8e8b0"/>
  <!-- skull -->
  <ellipse cx="256" cy="272" rx="118" ry="132" fill="#e8dcc8"/>
  <ellipse cx="256" cy="300" rx="88" ry="72" fill="#1a1410"/>
  <!-- eyes -->
  <ellipse cx="206" cy="248" rx="28" ry="34" fill="#1a1410"/>
  <ellipse cx="306" cy="248" rx="28" ry="34" fill="#1a1410"/>
  <ellipse cx="214" cy="236" rx="8" ry="10" fill="#f0d080" opacity="0.55"/>
